name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [master]
  # Pull requests run the build job only, so the strict build checks every change before it
  # merges. The deploy job and the artifact upload are skipped for them.
  pull_request:
  # Most pages are copied in from agentos and agentos-extensions when the site builds, and
  # nothing in those repositories can start this workflow. The daily run picks their changes up.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer run on the same branch or pull request cancels this job while it builds, so only the
    # newest commit goes on to deploy. The deploy job stays out of the group, so a newer build never
    # stops a deploy part way, or between the deploy and its record. A re-run builds the commit its
    # first attempt built, which can be older than the branch, so it keys a group of its own and
    # never cancels a newer run.
    concurrency:
      group: pages-build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.sha) || '' }}
      cancel-in-progress: true
    outputs:
      agentos_sha: ${{ steps.sources.outputs.agentos_sha }}
      extensions_sha: ${{ steps.sources.outputs.extensions_sha }}
    steps:
      # Mirror the monorepo layout so relative paths (../../packages/agentos) resolve
      - name: Checkout agentos-live-docs
        uses: actions/checkout@v5
        with:
          path: apps/agentos-live-docs

      # .gitignore covers the folders the build fills. A file tracked there goes stale: every build
      # rewrites it and nobody commits the result.
      - name: No tracked file is under an ignored path
        working-directory: apps/agentos-live-docs
        run: |
          tracked=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked files under paths .gitignore excludes. Untrack them (git rm --cached) or add an exception to .gitignore."
            echo "$tracked"
            exit 1
          fi

      - name: Checkout agentos (source for docs + TypeDoc)
        uses: actions/checkout@v5
        with:
          repository: framerslab/agentos
          path: packages/agentos
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout agentos-extensions (source for extension docs)
        uses: actions/checkout@v5
        with:
          repository: framerslab/agentos-extensions
          path: packages/agentos-extensions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Note the source commits
        id: sources
        run: |
          echo "agentos_sha=$(git -C packages/agentos rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "extensions_sha=$(git -C packages/agentos-extensions rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/agentos-live-docs/package-lock.json

      # agentos installs with pnpm from its committed pnpm-lock.yaml, as its own CI does. npm
      # resolves the tree afresh and stops on a peer range that pnpm accepts with a warning.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install agentos deps (for TypeDoc type resolution)
        working-directory: packages/agentos
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install docs site deps
        working-directory: apps/agentos-live-docs
        run: npm ci

      # The publication manifest and pull contract, link rewriting, the search manifest plugin, the
      # home page's star badge, the counting of the landing page's cookbook figures, and the
      # concurrency groups and deploy conditions of this workflow and links.yml.
      - name: Check the publication contract
        working-directory: apps/agentos-live-docs
        run: npm run test:publication

      - name: Build site
        working-directory: apps/agentos-live-docs
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # PAT that plugins/github-stars.js sends when it reads the GitHub star
          # count for the home page's badge at build time. Without it the read is
          # unauthenticated; when the read fails, the badge names the repository
          # and shows no count. Pull request builds do not receive it: they run
          # code the pull request changed.
          GH_PAT: ${{ github.event_name != 'pull_request' && secrets.GH_PAT || '' }}

      # Reads the pages the build wrote, before they deploy: the cookbook counts on the documentation
      # landing page are the examples page's.
      - name: Check the built site
        working-directory: apps/agentos-live-docs
        run: npm run test:built

      - name: Upload artifact
        if: github.ref == 'refs/heads/master' && github.run_attempt == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/agentos-live-docs/build

  # Only a first attempt on master deploys. A pull request, or a run started by hand on another
  # branch, builds and checks the site and stops there; so does a re-run (see the rerun job).
  #
  # Deploys take turns: a newer run's deploy waits for the one running, which is never cancelled
  # part way, and replaces an older deploy still waiting. GitHub runs the jobs waiting in a group
  # in the order they started waiting, and does not promise that order. Deploys start waiting as
  # their builds finish, at least one build apart, because master's build group holds one build at
  # a time: a newer build cancels the one running. So an older build deploys after a newer one only
  # if GitHub starts its deploy more than a build's length late.
  #
  # After the deploy, the job records which agentos and agentos-extensions commits the live site
  # was built from, while it still holds the group, so the last record written names the sources of
  # the last deploy. The commit is also the repository activity that keeps the daily run enabled:
  # GitHub disables scheduled workflows in a public repository after 60 days without any. The file
  # is rewritten when a source commit changed, and otherwise once its date is 30 days old.
  #
  # The record is pushed with the repository's deploy key, not the workflow token. master's ruleset
  # requires the build and links checks, and deploy keys are the one actor it exempts: GitHub
  # refuses the GitHub Actions app, which issues the workflow token, as a bypass actor. The key is a
  # secret of the github-pages environment, which only master may use, so a run for a pull request
  # or on any other branch cannot read it. GitHub's rule that a push starts no workflow run is
  # written for the workflow token alone, so the commit message carries [skip ci] and the push
  # starts no second build.
  deploy:
    if: github.ref == 'refs/heads/master' && github.run_attempt == '1'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # A run that does not deploy keys a group of its own. GitHub's docs do not say whether a job
      # its condition skips takes a place in its group, and in pages-deploy one would replace a
      # deploy waiting there.
      group: ${{ github.ref == 'refs/heads/master' && github.run_attempt == '1' && 'pages-deploy' || format('pages-deploy-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out master to record the sources
        uses: actions/checkout@v5
        with:
          ref: master
          # The private half of the deploy key "record-sources (deploy workflow)". Given a key,
          # checkout fetches over SSH and leaves the key configured for the push below.
          ssh-key: ${{ secrets.DEPLOYED_SOURCES_DEPLOY_KEY }}

      - name: Update deployed-sources.json
        env:
          AGENTOS_SHA: ${{ needs.build.outputs.agentos_sha }}
          EXTENSIONS_SHA: ${{ needs.build.outputs.extensions_sha }}
        run: |
          set -euo pipefail
          file=deployed-sources.json
          for sha in "$AGENTOS_SHA" "$EXTENSIONS_SHA"; do
            case "$sha" in
              ""|*[!0-9a-f]*) echo "::error::The build job did not pass both source commits."; exit 1 ;;
            esac
          done
          today=$(date -u +%F)
          # A missing or unreadable file reads as empty values, so it is written again.
          old_agentos=""; old_extensions=""; old_date=""
          if [ -f "$file" ]; then
            old_agentos=$(jq -r '.agentos // ""' "$file" 2>/dev/null || true)
            old_extensions=$(jq -r '."agentos-extensions" // ""' "$file" 2>/dev/null || true)
            old_date=$(jq -r '.recorded // ""' "$file" 2>/dev/null || true)
          fi
          old_epoch=0
          if [ -n "$old_date" ]; then
            old_epoch=$(date -u -d "$old_date" +%s 2>/dev/null || echo 0)
          fi
          age_days=$(( ( $(date -u -d "$today" +%s) - old_epoch ) / 86400 ))
          if [ "$old_agentos" = "$AGENTOS_SHA" ] && [ "$old_extensions" = "$EXTENSIONS_SHA" ] && [ "$age_days" -lt 30 ]; then
            echo "Sources unchanged since $old_date; nothing to record."
            exit 0
          fi
          jq -n --arg a "$AGENTOS_SHA" --arg e "$EXTENSIONS_SHA" --arg d "$today" \
            '{agentos: $a, "agentos-extensions": $e, recorded: $d}' > "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore: record the sources of the deployed site [skip ci]"
          # Without the deploy key, checkout fetched over HTTPS with the workflow token, and the
          # ruleset would reject the push.
          case "$(git remote get-url origin)" in
            git@github.com:*) ;;
            *) echo "::error::The github-pages environment has no DEPLOYED_SOURCES_DEPLOY_KEY secret, so the push to master would be rejected. See AGENTS.md, Deployment."; exit 1 ;;
          esac
          # master can move while the site builds; replay the one commit on top and push again.
          git push origin HEAD:master || {
            git pull --rebase origin master
            git push origin HEAD:master
          }

  # A re-run does not deploy. A full re-run builds the commit its first attempt built, from the
  # sources of the moment it runs, and a re-run of failed jobs runs those jobs and the jobs that
  # need them, so a re-run deploy job would deploy the first attempt's build. Either can be older
  # than what another run deployed in between, and its deploy, waiting in the deploys' group, would
  # replace a newer deploy waiting there. On master this job fails the re-run and says how to
  # deploy. It joins no concurrency group and names no environment, so it replaces no waiting job
  # and records no deployment. It needs the other two jobs, so a re-run of either takes it along,
  # and !cancelled() runs it although the deploy job was skipped.
  rerun:
    name: re-runs do not deploy
    needs: [build, deploy]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.run_attempt != '1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Say how to deploy master
        run: |
          echo "::error::A re-run does not deploy: it would deploy the commit its first attempt built, or that attempt's build, and either can be older than a deploy made since. To deploy master, start this workflow on master: Actions, Deploy Docusaurus to GitHub Pages, Run workflow."
          exit 1
