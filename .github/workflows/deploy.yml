name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [master]
  # Pull requests run the build job only, so the strict build checks every change before it
  # merges. The deploy job and the artifact upload are skipped for them.
  pull_request:
  # Most pages are copied in from agentos and agentos-extensions when the site builds, and
  # nothing in those repositories can start this workflow. The daily run picks their changes up.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each pull request builds in its own group, so a pull request never cancels a deploy.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      agentos_sha: ${{ steps.sources.outputs.agentos_sha }}
      extensions_sha: ${{ steps.sources.outputs.extensions_sha }}
    steps:
      # Mirror the monorepo layout so relative paths (../../packages/agentos) resolve
      - name: Checkout agentos-live-docs
        uses: actions/checkout@v5
        with:
          path: apps/agentos-live-docs

      - name: Checkout agentos (source for docs + TypeDoc)
        uses: actions/checkout@v5
        with:
          repository: framerslab/agentos
          path: packages/agentos
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout agentos-extensions (source for extension docs)
        uses: actions/checkout@v5
        with:
          repository: framerslab/agentos-extensions
          path: packages/agentos-extensions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Note the source commits
        id: sources
        run: |
          echo "agentos_sha=$(git -C packages/agentos rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "extensions_sha=$(git -C packages/agentos-extensions rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/agentos-live-docs/package-lock.json

      # agentos installs with pnpm from its committed pnpm-lock.yaml, as its own CI does. npm
      # resolves the tree afresh and stops on a peer range that pnpm accepts with a warning.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install agentos deps (for TypeDoc type resolution)
        working-directory: packages/agentos
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install docs site deps
        working-directory: apps/agentos-live-docs
        run: npm ci

      # The publication manifest and pull contract, link rewriting and the search manifest plugin.
      - name: Check the publication contract
        working-directory: apps/agentos-live-docs
        run: npm run test:publication

      # PROBE (this pull request only): which tracked files under ignored paths does a clean build reproduce?
      - name: Remove the tracked files that .gitignore excludes
        working-directory: apps/agentos-live-docs
        run: |
          git ls-files -ci --exclude-standard > "$RUNNER_TEMP/tracked-ignored.txt"
          echo "tracked files under ignored paths: $(wc -l < "$RUNNER_TEMP/tracked-ignored.txt")"
          while IFS= read -r f; do rm -f -- "$f"; done < "$RUNNER_TEMP/tracked-ignored.txt"

      - name: Build site
        working-directory: apps/agentos-live-docs
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # PAT used by docusaurus.config.ts to fetch the live GitHub
          # star count for the hero badge at build time. Falls back to
          # a hardcoded count if missing or if the call fails. Pull request
          # builds do not receive it: they run code the pull request changed.
          GH_PAT: ${{ github.event_name != 'pull_request' && secrets.GH_PAT || '' }}

      - name: Report the files the build did not reproduce
        if: always()
        working-directory: apps/agentos-live-docs
        run: |
          missing=0
          while IFS= read -r f; do
            if [ ! -e "$f" ]; then echo "NOT REPRODUCED: $f"; missing=$((missing+1)); fi
          done < "$RUNNER_TEMP/tracked-ignored.txt"
          echo "not reproduced: $missing of $(wc -l < "$RUNNER_TEMP/tracked-ignored.txt")"
          echo "changed by the build (reproduced with different content): $(git status --porcelain -- $(cut -d/ -f1-2 "$RUNNER_TEMP/tracked-ignored.txt" | sort -u) | grep -c '^ M' || true)"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/agentos-live-docs/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Records which agentos and agentos-extensions commits the live site was built from. The
  # commit is also the repository activity that keeps the daily run enabled: GitHub disables
  # scheduled workflows in a public repository after 60 days without any. The file is rewritten
  # when a source commit changed, and otherwise once its date is 30 days old.
  record-sources:
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Update deployed-sources.json
        env:
          AGENTOS_SHA: ${{ needs.build.outputs.agentos_sha }}
          EXTENSIONS_SHA: ${{ needs.build.outputs.extensions_sha }}
        run: |
          set -euo pipefail
          file=deployed-sources.json
          for sha in "$AGENTOS_SHA" "$EXTENSIONS_SHA"; do
            case "$sha" in
              ""|*[!0-9a-f]*) echo "::error::The build job did not pass both source commits."; exit 1 ;;
            esac
          done
          today=$(date -u +%F)
          # A missing or unreadable file reads as empty values, so it is written again.
          old_agentos=""; old_extensions=""; old_date=""
          if [ -f "$file" ]; then
            old_agentos=$(jq -r '.agentos // ""' "$file" 2>/dev/null || true)
            old_extensions=$(jq -r '."agentos-extensions" // ""' "$file" 2>/dev/null || true)
            old_date=$(jq -r '.recorded // ""' "$file" 2>/dev/null || true)
          fi
          old_epoch=0
          if [ -n "$old_date" ]; then
            old_epoch=$(date -u -d "$old_date" +%s 2>/dev/null || echo 0)
          fi
          age_days=$(( ( $(date -u -d "$today" +%s) - old_epoch ) / 86400 ))
          if [ "$old_agentos" = "$AGENTOS_SHA" ] && [ "$old_extensions" = "$EXTENSIONS_SHA" ] && [ "$age_days" -lt 30 ]; then
            echo "Sources unchanged since $old_date; nothing to record."
            exit 0
          fi
          jq -n --arg a "$AGENTOS_SHA" --arg e "$EXTENSIONS_SHA" --arg d "$today" \
            '{agentos: $a, "agentos-extensions": $e, recorded: $d}' > "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore: record the sources of the deployed site"
          # master can move while the site builds; replay the one commit on top and push again.
          git push origin HEAD:master || {
            git pull --rebase origin master
            git push origin HEAD:master
          }
