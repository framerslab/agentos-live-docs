name: Links

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or pull request cancels an older one. A re-run checks the commit
# its first attempt checked, which can be older than the branch, so it keys a group of its own and
# never cancels a newer run.
concurrency:
  group: links-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Links within this repository
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --hidden --no-progress
            --root-dir ${{ github.workspace }}
            --remap "^https://github\.com/framerslab/agentos-live-docs/(blob|tree)/master/ file://${{ github.workspace }}/"
            --exclude-path CHANGELOG.md
            './*.md' './.github/**/*.md'
      - name: Links to other first-party repositories
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include '^https://github\.com/(framerslab|jddunn|manicinc)/[^/]+/(blob|tree)/'
            --exclude-path CHANGELOG.md
            './*.md' './.github/**/*.md' './.github/ISSUE_TEMPLATE/*.yml'
