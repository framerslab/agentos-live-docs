<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 638" role="img" aria-labelledby="ac-title ac-desc" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title id="ac-title">AgentCommunicationBus architecture</title>
  <desc id="ac-desc">One in-process class a host builds and wires its agents to, with three steps for every message. Routing picks the target agents: sendToAgent for one agent by id, sendToRole for one agent holding a role (by default a random one when several do), broadcast for every agent in the agency but the sender, publishToTopic for each handler subscribed to a topic; requestResponse waits for a reply and handoff is a request that waits 60 seconds. Subscriptions decide which handlers get a message: subscribe with filters on message type, sender role, minimum priority and thread, subscribeToTopic for a topic made by createTopic, and registerAgent for the agency and role map that routing reads. Delivery runs in process, at once: the matching handlers are awaited one by one, and a handler that throws does not stop the rest. A send gets a delivery status, the bus keeps the last 100 messages per agent by default, and retryDelivery re-sends a failed send from that history when the host calls it; a send that no handler takes, or that every handler throws on, is marked failed at once, unless it answers a pending request. publishToTopic calls the topic's handlers itself: its messages stay out of the history, so retryDelivery cannot re-send them, and a topic with no subscribers returns no statuses. There is no queue and no automatic retry.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .heading      { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .subtitle     { fill: #475569; font-size: 12px; }
      .layer-title  { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .layer-text   { fill: #475569; font-size: 11px; }
      .lane-label   { fill: #64748b; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; }
      .container    { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .layer        { fill: #ffffff; stroke-width: 1.75; }
      .mini         { fill: #ffffff; stroke-width: 1.25; }
      .mini-text    { fill: #0f172a; font-size: 11px; font-weight: 600; }
      .arrow-line   { stroke: #94a3b8; stroke-width: 1.75; fill: none; }
      .arrow-head   { fill: #94a3b8; }
      .acc-route    { stroke: #ec4899; }
      .acc-sub      { stroke: #6366f1; }
      .acc-deliver  { stroke: #10b981; }
          </style>
    <marker id="ac-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="638"/>

  <!-- Header -->
  <text x="500" y="32" text-anchor="middle" class="heading">AgentCommunicationBus</text>
  <text x="500" y="54" text-anchor="middle" class="subtitle">One in-process class a host builds and wires its agents to · three steps for every message</text>

  <!-- Outer container -->
  <rect x="40" y="80" width="920" height="536" rx="14" class="container"/>

  <!-- Step 1: routing -->
  <rect x="70" y="110" width="860" height="146" rx="10" class="layer acc-route"/>
  <text x="90" y="132" class="layer-title">1 · Routing</text>
  <text x="90" y="150" class="layer-text">Picks the target agents of each message</text>

  <rect x="90" y="162" width="190" height="58" rx="6" class="mini acc-route"/>
  <text x="185" y="180" text-anchor="middle" class="mini-text">sendToAgent()</text>
  <text x="185" y="197" text-anchor="middle" class="layer-text">one agent, by its id</text>

  <rect x="300" y="162" width="190" height="58" rx="6" class="mini acc-route"/>
  <text x="395" y="180" text-anchor="middle" class="mini-text">sendToRole()</text>
  <text x="395" y="197" text-anchor="middle" class="layer-text">one agent with the role:</text>
  <text x="395" y="211" text-anchor="middle" class="layer-text">random if several, by default</text>

  <rect x="510" y="162" width="190" height="58" rx="6" class="mini acc-route"/>
  <text x="605" y="180" text-anchor="middle" class="mini-text">broadcast()</text>
  <text x="605" y="197" text-anchor="middle" class="layer-text">every agent in the agency</text>
  <text x="605" y="211" text-anchor="middle" class="layer-text">but the sender</text>

  <rect x="720" y="162" width="190" height="58" rx="6" class="mini acc-route"/>
  <text x="815" y="180" text-anchor="middle" class="mini-text">publishToTopic()</text>
  <text x="815" y="197" text-anchor="middle" class="layer-text">each handler subscribed</text>
  <text x="815" y="211" text-anchor="middle" class="layer-text">to the topic</text>

  <text x="90" y="242" class="layer-text">broadcastToRoles(): chosen roles only · requestResponse(): waits for a reply, 30 s default · handoff(): a request, 60 s</text>

  <line class="arrow-line" x1="500" y1="256" x2="500" y2="278" marker-end="url(#ac-arrow)"/>

  <!-- Step 2: subscriptions -->
  <rect x="70" y="280" width="860" height="118" rx="10" class="layer acc-sub"/>
  <text x="90" y="302" class="layer-title">2 · Subscriptions</text>
  <text x="90" y="320" class="layer-text">Decide which handlers get a message</text>

  <rect x="90" y="332" width="260" height="56" rx="6" class="mini acc-sub"/>
  <text x="220" y="350" text-anchor="middle" class="mini-text">subscribe(agentId, handler, options)</text>
  <text x="220" y="367" text-anchor="middle" class="layer-text">filters: messageTypes, fromRoles,</text>
  <text x="220" y="381" text-anchor="middle" class="layer-text">minPriority, threadId</text>

  <rect x="370" y="332" width="260" height="56" rx="6" class="mini acc-sub"/>
  <text x="500" y="350" text-anchor="middle" class="mini-text">subscribeToTopic()</text>
  <text x="500" y="367" text-anchor="middle" class="layer-text">a handler for a topic</text>
  <text x="500" y="381" text-anchor="middle" class="layer-text">made by createTopic()</text>

  <rect x="650" y="332" width="260" height="56" rx="6" class="mini acc-sub"/>
  <text x="780" y="350" text-anchor="middle" class="mini-text">registerAgent(agent, agency, role)</text>
  <text x="780" y="367" text-anchor="middle" class="layer-text">the agency and role map</text>
  <text x="780" y="381" text-anchor="middle" class="layer-text">that routing reads</text>

  <line class="arrow-line" x1="500" y1="398" x2="500" y2="420" marker-end="url(#ac-arrow)"/>

  <!-- Step 3: delivery -->
  <rect x="70" y="422" width="860" height="174" rx="10" class="layer acc-deliver"/>
  <text x="90" y="444" class="layer-title">3 · Delivery</text>
  <text x="90" y="462" class="layer-text">In process, at once, to every matching handler</text>

  <rect x="90" y="474" width="190" height="58" rx="6" class="mini acc-deliver"/>
  <text x="185" y="492" text-anchor="middle" class="mini-text">Handlers, in turn</text>
  <text x="185" y="509" text-anchor="middle" class="layer-text">a handler that throws</text>
  <text x="185" y="523" text-anchor="middle" class="layer-text">does not stop the rest</text>

  <rect x="300" y="474" width="190" height="58" rx="6" class="mini acc-deliver"/>
  <text x="395" y="492" text-anchor="middle" class="mini-text">Delivery status</text>
  <text x="395" y="509" text-anchor="middle" class="layer-text">delivered · failed ·</text>
  <text x="395" y="523" text-anchor="middle" class="layer-text">acknowledged</text>

  <rect x="510" y="474" width="190" height="58" rx="6" class="mini acc-deliver"/>
  <text x="605" y="492" text-anchor="middle" class="mini-text">retryDelivery(messageId)</text>
  <text x="605" y="509" text-anchor="middle" class="layer-text">re-sends a failed send from</text>
  <text x="605" y="523" text-anchor="middle" class="layer-text">history when the host calls it</text>

  <rect x="720" y="474" width="190" height="58" rx="6" class="mini acc-deliver"/>
  <text x="815" y="492" text-anchor="middle" class="mini-text">Message history</text>
  <text x="815" y="509" text-anchor="middle" class="layer-text">the last 100 per agent</text>
  <text x="815" y="523" text-anchor="middle" class="layer-text">by default</text>

  <text x="90" y="554" class="layer-text">No queue and no automatic retry: a send that no handler takes, or that every handler throws on, is marked failed at once,</text>
  <text x="90" y="568" class="layer-text">unless it answers a pending request. publishToTopic() calls the topic's handlers itself: its messages stay out of the history,</text>
  <text x="90" y="582" class="layer-text">so retryDelivery() cannot re-send them, and a topic with no subscribers returns no statuses.</text>
</svg>
