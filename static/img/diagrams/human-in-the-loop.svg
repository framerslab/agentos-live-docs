<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 772" width="1100" height="772">
  <defs>
    <linearGradient id="hitl-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .lane-bg { fill: rgba(99, 102, 241, 0.04); stroke: rgba(99, 102, 241, 0.22); stroke-width: 1; }
      .card    { fill: rgba(255, 255, 255, 0.5); stroke: #6366f1; stroke-width: 1.5; }
      .trigger { fill: rgba(236, 72, 153, 0.06); stroke: #ec4899; stroke-width: 1; }
      .handler { fill: rgba(139, 92, 246, 0.08); stroke: #8b5cf6; stroke-width: 1.25; }
      .runtime { fill: rgba(6, 182, 212, 0.06); stroke: #06b6d4; stroke-width: 1.25; }
      .arrow   { stroke: #6366f1; stroke-width: 1.5; fill: none; }
      .arrow-soft { stroke: rgba(99, 102, 241, 0.45); stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .h1 { font: 700 18px Inter, system-ui, sans-serif; fill: #1e1b4b; }
      .h2 { font: 600 13px Inter, system-ui, sans-serif; fill: #3730a3; }
      .h3 { font: 600 11px Inter, system-ui, sans-serif; fill: #5b21b6; letter-spacing: 0.04em; text-transform: uppercase; }
      .b  { font: 500 11px Inter, system-ui, sans-serif; fill: #1e293b; }
      .m  { font: 11px 'JetBrains Mono', ui-monospace, monospace; fill: #4338ca; }
      .lbl{ font: 600 10px Inter, system-ui, sans-serif; fill: #475569; letter-spacing: 0.08em; text-transform: uppercase; }
          </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" />
    </marker>
    <marker id="arrowhead-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a5b4fc" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="772"/>

  <!-- Title strip -->
  <text x="40" y="38" class="h1">Human-in-the-Loop · Three integration surfaces, three decision contracts</text>
  <line x1="40" y1="52" x2="1060" y2="52" stroke="url(#hitl-brand)" stroke-width="2" />

  <!-- LANE 1: agency() declarative HITL -->
  <rect x="40" y="74" width="320" height="420" rx="12" class="lane-bg" />
  <text x="56" y="100" class="h3">Lane 1 · Agency</text>
  <text x="56" y="118" class="h2">HitlConfig (declarative)</text>

  <rect x="56" y="132" width="288" height="60" rx="8" class="card" />
  <text x="70" y="152" class="b">agency({ hitl: { approvals, handler, ... } })</text>
  <text x="70" y="170" class="m">src/api/types.ts · src/api/hitl.ts</text>
  <text x="70" y="184" class="lbl">Public config interface</text>

  <text x="56" y="216" class="h3">Five opt-in approval triggers</text>
  <rect x="56" y="226" width="288" height="22" rx="5" class="trigger" />
  <text x="68" y="241" class="b"><tspan font-weight="600">beforeTool</tspan> — listed tool names, or '*'</text>
  <rect x="56" y="252" width="288" height="22" rx="5" class="trigger" />
  <text x="68" y="267" class="b"><tspan font-weight="600">beforeAgent</tspan> — listed agent names</text>
  <rect x="56" y="278" width="288" height="22" rx="5" class="trigger" />
  <text x="68" y="293" class="b"><tspan font-weight="600">beforeEmergent</tspan> — gate spawn_specialist</text>
  <rect x="56" y="304" width="288" height="22" rx="5" class="trigger" />
  <text x="68" y="319" class="b"><tspan font-weight="600">beforeReturn</tspan> — gate the final answer</text>
  <rect x="56" y="330" width="288" height="22" rx="5" class="trigger" />
  <text x="68" y="345" class="b"><tspan font-weight="600">beforeStrategyOverride</tspan> — pauses nothing</text>

  <text x="56" y="378" class="h3">Six handler factories</text>
  <rect x="56" y="386" width="288" height="100" rx="8" class="handler" />
  <text x="70" y="402" class="m">hitl.cli()</text>
  <text x="70" y="416" class="m">hitl.autoApprove()</text>
  <text x="70" y="430" class="m">hitl.autoReject(reason?)</text>
  <text x="70" y="444" class="m">hitl.webhook(url)</text>
  <text x="70" y="458" class="m">hitl.slack({ channel, token })</text>
  <text x="70" y="472" class="m">hitl.llmJudge({ criteria, ... })</text>

  <!-- LANE 2: AgentGraph human node / workflow() human step -->
  <rect x="384" y="74" width="332" height="420" rx="12" class="lane-bg" />
  <text x="400" y="100" class="h3">Lane 2 · Workflow / Graph</text>
  <text x="400" y="118" class="h2">human node</text>

  <rect x="400" y="132" width="300" height="60" rx="8" class="card" />
  <text x="414" y="150" class="b">AgentGraph: humanNode({ prompt, ... })</text>
  <text x="414" y="166" class="b">workflow(): step(id, { human: { prompt } })</text>
  <text x="414" y="184" class="m">src/orchestration/builders/nodes.ts</text>

  <text x="400" y="216" class="h3">humanNode() modes, in this order</text>
  <rect x="400" y="226" width="300" height="22" rx="5" class="trigger" />
  <text x="412" y="241" class="b"><tspan font-weight="600">autoAccept</tspan> — approved at once</text>
  <rect x="400" y="252" width="300" height="22" rx="5" class="trigger" />
  <text x="412" y="267" class="b"><tspan font-weight="600">autoReject</tspan> — rejected at once</text>
  <rect x="400" y="278" width="300" height="22" rx="5" class="trigger" />
  <text x="412" y="293" class="b"><tspan font-weight="600">judge</tspan> — verdict at confidence ≥ threshold</text>
  <rect x="400" y="304" width="300" height="22" rx="5" class="trigger" />
  <text x="412" y="319" class="b"><tspan font-weight="600">none</tspan> (or judge unsure, failed) — suspend</text>
  <text x="400" y="344" class="b">A workflow() step takes no mode: it suspends.</text>

  <text x="400" y="372" class="h3">Effect class</text>
  <rect x="400" y="382" width="300" height="38" rx="6" class="handler" />
  <text x="414" y="398" class="m">effectClass 'human' on every human node</text>
  <text x="414" y="413" class="m">resume() replays its recorded output</text>

  <text x="400" y="444" class="h3">Node timeout</text>
  <rect x="400" y="454" width="300" height="22" rx="5" class="card" />
  <text x="414" y="469" class="m">onTimeout: 'accept' | 'reject' | 'error'</text>

  <!-- LANE 3: runtime HumanInteractionManager -->
  <rect x="740" y="74" width="320" height="420" rx="12" class="lane-bg" />
  <text x="756" y="100" class="h3">Lane 3 · Runtime</text>
  <text x="756" y="118" class="h2">HumanInteractionManager</text>

  <rect x="756" y="132" width="288" height="60" rx="8" class="card" />
  <text x="770" y="152" class="b">IHumanInteractionManager</text>
  <text x="770" y="170" class="m">src/orchestration/hitl/</text>
  <text x="770" y="184" class="lbl">Severity-aware approval surface</text>

  <text x="756" y="216" class="h3">PendingAction</text>
  <rect x="756" y="226" width="288" height="100" rx="6" class="runtime" />
  <text x="770" y="244" class="b">actionId · description · category</text>
  <text x="770" y="260" class="m">severity:</text>
  <text x="770" y="274" class="m">  'low' | 'medium' | 'high' | 'critical'</text>
  <text x="770" y="290" class="b">reversible · potentialConsequences</text>
  <text x="770" y="304" class="b">estimatedCost · alternatives</text>
  <text x="770" y="318" class="b">requestedAt · timeoutMs</text>

  <text x="756" y="346" class="h3">Four interaction modes</text>
  <rect x="756" y="356" width="288" height="20" rx="4" class="handler" />
  <text x="770" y="370" class="b">requestApproval(PendingAction)</text>
  <rect x="756" y="380" width="288" height="20" rx="4" class="handler" />
  <text x="770" y="394" class="b">requestClarification(ClarificationRequest)</text>
  <rect x="756" y="404" width="288" height="20" rx="4" class="handler" />
  <text x="770" y="418" class="b">requestEdit(DraftOutput)</text>
  <rect x="756" y="428" width="288" height="20" rx="4" class="handler" />
  <text x="770" y="442" class="b">escalate(EscalationContext)</text>

  <text x="756" y="466" class="lbl">Escalation reasons:</text>
  <text x="756" y="478" class="lbl">low_confidence · safety_concern · …</text>

  <!-- Each lane flows into its own decision contract -->
  <path d="M 200 494 L 200 510" class="arrow-soft" marker-end="url(#arrowhead-soft)" />
  <path d="M 550 494 L 550 510" class="arrow-soft" marker-end="url(#arrowhead-soft)" />
  <path d="M 900 494 L 900 510" class="arrow-soft" marker-end="url(#arrowhead-soft)" />

  <!-- Contract 1: agency() -->
  <rect x="40" y="512" width="320" height="236" rx="12" class="lane-bg" />
  <text x="56" y="536" class="h3">Agency contract</text>

  <rect x="56" y="548" width="288" height="36" rx="6" class="card" />
  <text x="68" y="563" class="b">ApprovalRequest</text>
  <text x="68" y="577" class="m">id · type · agent · action · details</text>

  <rect x="56" y="594" width="288" height="50" rx="6" class="handler" />
  <text x="68" y="609" class="b">Your handler decides</text>
  <text x="68" y="623" class="m">timeoutMs + onTimeout apply on</text>
  <text x="68" y="637" class="m">beforeTool and beforeReturn</text>

  <rect x="56" y="654" width="288" height="36" rx="6" class="card" />
  <text x="68" y="669" class="b">ApprovalDecision</text>
  <text x="68" y="683" class="m">approved · reason · modifications</text>

  <rect x="56" y="700" width="288" height="36" rx="6" class="trigger" />
  <text x="68" y="715" class="b">A post-approval check can veto a yes</text>
  <text x="68" y="729" class="m">code-safety · pii-redaction</text>

  <path d="M 200 584 L 200 592" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 200 644 L 200 652" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 200 690 L 200 698" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Contract 2: graph human node -->
  <rect x="384" y="512" width="332" height="236" rx="12" class="lane-bg" />
  <text x="400" y="536" class="h3">Graph contract (no handler)</text>

  <rect x="400" y="548" width="300" height="36" rx="6" class="card" />
  <text x="412" y="563" class="b">A mode decides: the node's output</text>
  <text x="412" y="577" class="m">{ approved, decidedBy, ... }</text>

  <rect x="400" y="594" width="300" height="50" rx="6" class="trigger" />
  <text x="412" y="609" class="b">A yes no human gave is checked</text>
  <text x="412" y="623" class="m">deps.guardrailEngine, when wired:</text>
  <text x="412" y="637" class="m">pii-redaction · code-safety</text>

  <rect x="400" y="654" width="300" height="36" rx="6" class="handler" />
  <text x="412" y="669" class="b">No decision: checkpoint saved</text>
  <text x="412" y="683" class="m">interrupt event, 'human_approval'</text>

  <rect x="400" y="700" width="300" height="36" rx="6" class="card" />
  <text x="412" y="715" class="b">The host writes the answer, resumes</text>
  <text x="412" y="729" class="m">fork(checkpointId, patch) · resume()</text>

  <path d="M 550 584 L 550 592" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 550 690 L 550 698" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Contract 3: runtime manager -->
  <rect x="740" y="512" width="320" height="236" rx="12" class="lane-bg" />
  <text x="756" y="536" class="h3">Runtime contract</text>

  <rect x="756" y="548" width="288" height="36" rx="6" class="card" />
  <text x="768" y="563" class="b">requestApproval(PendingAction)</text>
  <text x="768" y="577" class="m">notificationHandler: approval_required</text>

  <rect x="756" y="594" width="288" height="36" rx="6" class="handler" />
  <text x="768" y="609" class="b">A human answers</text>
  <text x="768" y="623" class="m">submitApprovalDecision(decision)</text>

  <rect x="756" y="640" width="288" height="50" rx="6" class="card" />
  <text x="768" y="655" class="b">ApprovalDecision, its own type</text>
  <text x="768" y="669" class="m">actionId · approved · decidedBy</text>
  <text x="768" y="683" class="m">rejectionReason? · decidedAt</text>

  <rect x="756" y="700" width="288" height="36" rx="6" class="runtime" />
  <text x="768" y="715" class="b">Asked by ToolOrchestrator, step gate</text>
  <text x="768" y="729" class="m">hasSideEffects tools, hitl.enabled</text>

  <path d="M 900 584 L 900 592" class="arrow" marker-end="url(#arrowhead)" />
  <path d="M 900 630 L 900 638" class="arrow" marker-end="url(#arrowhead)" />
</svg>
