<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 648" width="1120" height="648">
  <defs>
    <linearGradient id="ai-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <style>
      .bg { fill: #0f172a; }
      .lane-bg { fill: rgba(99, 102, 241, 0.06); stroke: rgba(165, 180, 252, 0.25); stroke-width: 1; }
      .card { fill: rgba(30, 27, 75, 0.55); stroke: #a5b4fc; stroke-width: 1.5; }
      .trigger { fill: rgba(244, 114, 182, 0.10); stroke: #f9a8d4; stroke-width: 1; }
      .handler { fill: rgba(167, 139, 250, 0.12); stroke: #c4b5fd; stroke-width: 1.25; }
      .state { fill: rgba(34, 211, 238, 0.10); stroke: #67e8f9; stroke-width: 1.25; }
      .turn { fill: rgba(52, 211, 153, 0.10); stroke: #6ee7b7; stroke-width: 1.25; }
      .arrow { stroke: #a5b4fc; stroke-width: 1.5; fill: none; }
      .arrow-soft { stroke: rgba(165, 180, 252, 0.4); stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .h1 { font: 700 18px Inter, system-ui, sans-serif; fill: #f5f3ff; }
      .h2 { font: 600 13px Inter, system-ui, sans-serif; fill: #c7d2fe; }
      .h3 { font: 600 11px Inter, system-ui, sans-serif; fill: #c4b5fd; letter-spacing: 0.04em; text-transform: uppercase; }
      .b { font: 500 11px Inter, system-ui, sans-serif; fill: #e2e8f0; }
      .m { font: 11px 'JetBrains Mono', ui-monospace, monospace; fill: #a5b4fc; }
      .lbl { font: 600 10px Inter, system-ui, sans-serif; fill: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
    <marker id="ai-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="648"/>

  <text x="40" y="38" class="h1">Adaptive Prompt Intelligence · Prompt assembly each turn + metaprompts after it</text>
  <line x1="40" y1="52" x2="1080" y2="52" stroke="url(#ai-brand)" stroke-width="2" />

  <!-- One turn of a GMI (top band) -->
  <rect x="40" y="74" width="1040" height="116" rx="12" class="lane-bg" />
  <text x="56" y="100" class="h3">One turn of a GMI</text>

  <rect x="56" y="112" width="160" height="64" rx="8" class="turn" />
  <text x="68" y="132" class="b">User message</text>
  <text x="68" y="148" class="m">SentimentTracker</text>
  <text x="68" y="160" class="m">scores it (opt-in)</text>

  <rect x="240" y="112" width="200" height="64" rx="8" class="handler" />
  <text x="252" y="132" class="b">PromptEngine</text>
  <text x="252" y="148" class="m">constructPrompt(): persona</text>
  <text x="252" y="160" class="m">+ elements matching state</text>

  <rect x="464" y="112" width="168" height="64" rx="8" class="card" />
  <text x="476" y="132" class="b">Model call</text>
  <text x="476" y="148" class="m">streamed reply, tool</text>
  <text x="476" y="160" class="m">rounds as needed</text>

  <rect x="656" y="112" width="216" height="64" rx="8" class="handler" />
  <text x="668" y="132" class="b">MetapromptExecutor</text>
  <text x="668" y="148" class="m">checkAndTriggerMetaprompts()</text>
  <text x="668" y="160" class="m">fired ones: background batch</text>

  <rect x="896" y="112" width="168" height="64" rx="8" class="state" />
  <text x="908" y="132" class="b">Updates applied</text>
  <text x="908" y="148" class="m">to GMI state and</text>
  <text x="908" y="160" class="m">working memory</text>

  <path d="M 216 144 L 238 144" class="arrow" marker-end="url(#ai-arrow)" />
  <path d="M 440 144 L 462 144" class="arrow" marker-end="url(#ai-arrow)" />
  <path d="M 632 144 L 654 144" class="arrow" marker-end="url(#ai-arrow)" />
  <path d="M 872 144 L 894 144" class="arrow" marker-end="url(#ai-arrow)" />

  <!-- Three trigger lanes (middle band) -->
  <text x="40" y="218" class="h3">Three metaprompt trigger types</text>

  <!-- Lane: turn_interval -->
  <rect x="40" y="228" width="340" height="228" rx="12" class="lane-bg" />
  <text x="56" y="252" class="h2">turn_interval</text>
  <text x="56" y="268" class="b">Counts user turns</text>
  <rect x="56" y="280" width="308" height="54" rx="6" class="trigger" />
  <text x="68" y="298" class="b">{ type: 'turn_interval',</text>
  <text x="68" y="314" class="b">&#160;&#160;intervalTurns: 5 }</text>
  <text x="68" y="326" class="lbl">Fires on user turns N, 2N, 3N</text>

  <rect x="56" y="346" width="308" height="100" rx="6" class="handler" />
  <text x="68" y="364" class="b">Handler by metaprompt id:</text>
  <text x="68" y="380" class="m">• gmi_self_trait_adjustment:</text>
  <text x="68" y="394" class="m">&#160;&#160;mood, user skill, task context</text>
  <text x="68" y="408" class="m">• the five preset ids: own handlers</text>
  <text x="68" y="422" class="m">• other ids: generic handler</text>
  <text x="68" y="436" class="lbl">From the persona's metaPrompts</text>

  <!-- Lane: event_based -->
  <rect x="392" y="228" width="340" height="228" rx="12" class="lane-bg" />
  <text x="408" y="252" class="h2">event_based</text>
  <text x="408" y="268" class="b">SentimentTracker events</text>
  <rect x="408" y="280" width="308" height="54" rx="6" class="trigger" />
  <text x="420" y="298" class="b">{ type: 'event_based',</text>
  <text x="420" y="314" class="b">&#160;&#160;eventName: 'user_frustrated' }</text>
  <text x="420" y="326" class="lbl">Fires on a pending GMIEvent</text>

  <rect x="408" y="346" width="308" height="100" rx="6" class="handler" />
  <text x="420" y="364" class="b">Presets (persona sentimentTracking):</text>
  <text x="420" y="380" class="m">• frustration_recovery</text>
  <text x="420" y="394" class="m">• confusion_clarification</text>
  <text x="420" y="408" class="m">• satisfaction_reinforcement</text>
  <text x="420" y="422" class="m">• error_recovery · engagement_boost</text>
  <text x="420" y="436" class="lbl">Sentiment tracking is opt-in</text>

  <!-- Lane: manual -->
  <rect x="744" y="228" width="336" height="228" rx="12" class="lane-bg" />
  <text x="760" y="252" class="h2">manual</text>
  <text x="760" y="268" class="b">A flag host code sets</text>
  <rect x="760" y="280" width="304" height="54" rx="6" class="trigger" />
  <text x="772" y="298" class="b">{ type: 'manual' }</text>
  <text x="772" y="314" class="b">workingMemory: manual_trigger_&lt;id&gt;</text>
  <text x="772" y="326" class="lbl">Checked at the end of each turn</text>

  <rect x="760" y="346" width="304" height="100" rx="6" class="handler" />
  <text x="772" y="364" class="b">When the flag is set:</text>
  <text x="772" y="380" class="m">• the metaprompt is queued</text>
  <text x="772" y="394" class="m">• the flag is then deleted</text>
  <text x="772" y="408" class="m">• a metaprompt cannot set it</text>
  <text x="772" y="422" class="m">• known ids: own handler</text>
  <text x="772" y="436" class="lbl">Fired metaprompts call the LLM</text>

  <!-- Bottom band: state surfaces metaprompts write -->
  <rect x="40" y="474" width="1040" height="158" rx="12" class="lane-bg" />
  <text x="56" y="500" class="h3">State surfaces metaprompts write</text>
  <text x="56" y="518" class="h2">Applied from the metaprompt's JSON reply · prompt assembly reads mood, skill level and complexity, not imprints</text>

  <rect x="56" y="532" width="186" height="84" rx="8" class="state" />
  <text x="68" y="552" class="b">GMI mood</text>
  <text x="68" y="568" class="m">currentGmiMood</text>
  <text x="68" y="582" class="lbl">One of 8 named moods</text>
  <text x="68" y="600" class="m">onMoodUpdate(mood)</text>

  <rect x="262" y="532" width="186" height="84" rx="8" class="state" />
  <text x="274" y="552" class="b">User context</text>
  <text x="274" y="568" class="m">skillLevel</text>
  <text x="274" y="582" class="lbl">Inferred user skill</text>
  <text x="274" y="600" class="m">onUserContextUpdate()</text>

  <rect x="468" y="532" width="186" height="84" rx="8" class="state" />
  <text x="480" y="552" class="b">Task context</text>
  <text x="480" y="568" class="m">complexity</text>
  <text x="480" y="582" class="lbl">Task complexity</text>
  <text x="480" y="600" class="m">onTaskContextUpdate()</text>

  <rect x="674" y="532" width="186" height="84" rx="8" class="state" />
  <text x="686" y="552" class="b">Working-memory imprints</text>
  <text x="686" y="568" class="m">newMemoryImprints</text>
  <text x="686" y="582" class="lbl">Key-value entries</text>
  <text x="686" y="600" class="m">workingMemory.set(k, v)</text>

  <rect x="880" y="532" width="184" height="84" rx="8" class="card" />
  <text x="892" y="552" class="b">HEXACO traits</text>
  <text x="892" y="568" class="m">not set by metaprompts</text>
  <text x="892" y="582" class="lbl">adapt_personality tool</text>
  <text x="892" y="600" class="m">or setPersonalityTrait()</text>

  <!-- Soft links from middle band to state surfaces -->
  <path d="M 210 456 Q 210 468 210 474" class="arrow-soft" marker-end="url(#ai-arrow)" />
  <path d="M 562 456 Q 562 468 562 474" class="arrow-soft" marker-end="url(#ai-arrow)" />
  <path d="M 912 456 Q 912 468 912 474" class="arrow-soft" marker-end="url(#ai-arrow)" />
</svg>
